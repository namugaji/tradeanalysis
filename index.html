<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC Trading Strategy Analyzer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #111111;
      margin: 0 auto;
      padding: 1.5rem 2rem 3rem;
      max-width: 800px;
      color-scheme: light;
    }
    .analyzer { padding: 1rem 0; }
    .section { margin-bottom: 2rem; }
    .section-title { font-size: 13px; font-weight: 500; color: #555555; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 1rem; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .control-row { display: flex; flex-direction: column; gap: 4px; }
    .control-row label { font-size: 13px; color: #444444; }
    .control-row .val { font-size: 15px; font-weight: 500; }
    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .metric-card { background: #f2f2f2; border-radius: 8px; padding: 0.75rem 1rem; }
    .metric-label { font-size: 12px; color: #555555; margin-bottom: 4px; }
    .metric-value { font-size: 18px; font-weight: 500; }
    .metric-value.positive { color: #1D9E75; }
    .metric-value.negative { color: #E24B4A; }
    .metric-value.warning  { color: #BA7517; }
    .metric-sub  { font-size: 12px; color: #555555; margin-top: 2px; }
    .metric-sub2 { font-size: 12px; color: #555555; margin-top: 1px; }
    .metric-note { font-size: 11px; color: #777777; margin-top: 4px; font-style: italic; }
    .alert-box { border-radius: 8px; padding: 0.75rem 1rem; font-size: 13px; margin-bottom: 1rem; border: 1px solid; }
    .alert-warning { background: #FAEEDA; color: #633806; border-color: #BA7517; }
    .alert-good    { background: #E1F5EE; color: #085041; border-color: #0F6E56; }
    .chart-wrap { position: relative; width: 100%; height: 260px; margin-top: 1rem; }
    .divider { border: none; border-top: 1px solid #dddddd; margin: 1.5rem 0; }
    input[type=range] { width: 100%; accent-color: #185FA5; }
    .ev-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #e8e8e8; font-size: 14px; }
    .ev-row:last-child { border-bottom: none; }
    .ev-label { color: #444444; }
    .legend { display: flex; gap: 16px; font-size: 12px; color: #555555; margin-bottom: 6px; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-line { width: 18px; height: 2px; }
    .portfolio-row { display: flex; align-items: center; gap: 10px; }
    .currency-prefix { font-size: 15px; font-weight: 500; color: #444444; }
    #portfolio { width: 100%; padding: 8px 12px; font-size: 15px; font-weight: 500; border: 1px solid #cccccc; border-radius: 8px; background: #fff; color: #111111; box-sizing: border-box; }
    #portfolio:focus { outline: none; border-color: #185FA5; }
    .input-error { border-color: #E24B4A !important; }
    .error-msg { font-size: 12px; color: #E24B4A; margin-top: 4px; display: none; }
    .lang-btn { font-size: 13px; padding: 5px 14px; border-radius: 8px; border: 1px solid #cccccc; background: #fff; color: #111111; cursor: pointer; }
    .lang-btn:hover { background: #f2f2f2; }
    .preset-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
    .preset-btn { font-size: 13px; padding: 5px 14px; border-radius: 8px; border: 1px solid #cccccc; background: #fff; color: #111111; cursor: pointer; }
    .preset-btn:hover { background: #f2f2f2; }
    .preset-btn.active { border-color: #185FA5; color: #185FA5; background: #eef4fc; }
    .preset-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .live-badge { font-size: 12px; color: #555; margin-left: auto; }
    .live-badge span { font-weight: 500; color: #111; }
    .live-error { font-size: 11px; color: #E24B4A; margin-top: 4px; display: none; }
  </style>
</head>
<body>
<div class="analyzer">
  <div style="display:flex; justify-content:flex-end; margin-bottom:1rem;">
    <button class="lang-btn" id="lang-btn" onclick="toggleLang()">English</button>
  </div>

  <div class="section">
    <div class="section-title" data-i18n="presetsLabel"></div>
    <div class="preset-bar">
      <button class="preset-btn" id="btn-btc" onclick="loadPreset('btc')">BTC Perp</button>
      <button class="preset-btn" id="btn-es"  onclick="loadPreset('es')">S&amp;P 500 (ES)</button>
      <button class="preset-btn" id="btn-nq"  onclick="loadPreset('nq')">Nasdaq (NQ)</button>
      <div class="live-badge" id="live-badge"></div>
    </div>
    <div class="live-error" id="live-error"></div>
  </div>

  <hr class="divider">

  <div class="section">
    <div class="section-title" data-i18n="portfolioLabel"></div>
    <div class="portfolio-row">
      <span class="currency-prefix" id="currency-prefix"></span>
      <input type="number" id="portfolio" min="0" step="1000" value="50000">
    </div>
    <div class="error-msg" id="portfolio-error"></div>
  </div>

  <hr class="divider">

  <div class="section">
    <div class="section-title" data-i18n="strategyParams"></div>
    <div class="controls">
      <div class="control-row">
        <label><span data-i18n="winRate"></span>: <span class="val" id="wr-out">45%</span></label>
        <input type="range" id="wr" min="0" max="100" step="1" value="45">
      </div>
      <div class="control-row">
        <label><span data-i18n="rrRatio"></span>: <span class="val" id="rr-out">2.50R</span></label>
        <input type="range" id="rr" min="0" max="10" step="0.01" value="2.5">
      </div>
      <div class="control-row">
        <label><span data-i18n="tradesPerMonth"></span>: <span class="val" id="tm-out">20</span></label>
        <input type="range" id="tm" min="0" max="600" step="1" value="20">
      </div>
      <div class="control-row">
        <label><span data-i18n="riskPerTrade"></span>: <span class="val" id="rpt-out">1.0%</span></label>
        <input type="range" id="rpt" min="0" max="500" step="5" value="10">
      </div>
      <div class="control-row">
        <label><span data-i18n="atrLabel"></span>: <span class="val" id="atr-out">3.0%</span></label>
        <input type="range" id="atr" min="1" max="200" step="1" value="30">
      </div>
      <div class="control-row">
        <label><span data-i18n="stopMultLabel"></span>: <span class="val" id="mult-out">1.5×</span></label>
        <input type="range" id="stopmult" min="5" max="50" step="1" value="15">
      </div>
      <div class="control-row">
        <label><span data-i18n="feePerTx"></span>: <span class="val" id="fee-out">0.08%</span></label>
        <input type="range" id="fee" min="0" max="200" step="1" value="8">
      </div>
      <div class="control-row">
        <label><span data-i18n="slippageLabel"></span>: <span class="val" id="slip-out">0.00%</span></label>
        <input type="range" id="slippage" min="0" max="100" step="1" value="0">
      </div>
    </div>
  </div>

  <hr class="divider">

  <div class="section">
    <div class="section-title" data-i18n="sizingTitle"></div>
    <div class="ev-row" id="row-live-price" style="display:none;"><span class="ev-label" data-i18n="livePriceLabel"></span><span id="live-price-display"></span></div>
    <div class="ev-row"><span class="ev-label" data-i18n="stopDistLabel"></span><span id="stop-dist"></span></div>
    <div class="ev-row" id="row-stop-dollar" style="display:none;"><span class="ev-label" data-i18n="stopDollarLabel"></span><span id="stop-dollar"></span></div>
    <div class="ev-row"><span class="ev-label" data-i18n="posSizeLabel"></span><span id="pos-size"></span></div>
    <div class="ev-row" style="border-bottom:none;"><span class="ev-label" data-i18n="noiseRiskLabel"></span><span id="noise-risk" style="font-weight:500;"></span></div>
    <div style="font-size:11px;color:#888;margin-top:10px;font-style:italic;" data-i18n="atrDisclaimer"></div>
  </div>

  <hr class="divider">

  <div class="section">
    <div class="section-title" data-i18n="feeBreakdown"></div>
    <div class="ev-row"><span class="ev-label" data-i18n="totalFeeLabel"></span><span id="fee-total"></span></div>
    <div class="ev-row"><span class="ev-label" data-i18n="slippageCostLabel"></span><span id="slip-cost"></span></div>
    <div class="ev-row"><span class="ev-label" data-i18n="totalCostLabel"></span><span id="total-cost" style="font-weight:500;"></span></div>
    <div class="ev-row"><span class="ev-label" data-i18n="feeAsR"></span><span id="fee-r"></span></div>
  </div>

  <hr class="divider">

  <div class="section">
    <div class="section-title" data-i18n="evTitle"></div>
    <div class="ev-row"><span class="ev-label" data-i18n="grossEV"></span><span id="ev-gross"></span></div>
    <div class="ev-row"><span class="ev-label" data-i18n="netEV"></span><span id="ev-net" style="font-weight:500;"></span></div>
    <div class="ev-row"><span class="ev-label" data-i18n="breakEvenWR"></span><span id="be-wr"></span></div>
    <div class="ev-row"><span class="ev-label" data-i18n="edgeLabel"></span><span id="edge"></span></div>
  </div>

  <hr class="divider">

  <div class="section">
    <div class="section-title" data-i18n="monthlyTitle"></div>
    <div class="metric-grid">
      <div class="metric-card">
        <div class="metric-label" data-i18n="monthlyReturn"></div>
        <div class="metric-value" id="monthly-return"></div>
        <div class="metric-sub" id="monthly-return-usd"></div>
      </div>
      <div class="metric-card">
        <div class="metric-label" data-i18n="feeDrag"></div>
        <div class="metric-value warning" id="monthly-fees"></div>
        <div class="metric-sub" id="monthly-fees-usd"></div>
      </div>
      <div class="metric-card">
        <div class="metric-label" data-i18n="maxLossesLabel"></div>
        <div class="metric-value warning" id="max-losses"></div>
        <div class="metric-sub" id="max-losses-usd"></div>
        <div class="metric-sub2" id="max-losses-pct"></div>
      </div>
    </div>
  </div>

  <hr class="divider">

  <div class="section">
    <div class="section-title" data-i18n="chartTitle"></div>
    <div class="controls" style="margin-bottom:0.75rem;">
      <div class="control-row">
        <label><span data-i18n="chartWindow"></span>: <span class="val" id="days-out">100</span> <span data-i18n="daysUnit"></span></label>
        <input type="range" id="chartdays" min="7" max="1000" step="1" value="100">
      </div>
      <div class="control-row" style="justify-content:flex-end;">
        <label style="visibility:hidden;">x</label>
        <div style="font-size:12px;color:#aaa;margin-top:4px;" id="trades-in-window"></div>
      </div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-line" style="border-top:1px dashed #1D9E75;margin-top:1px;"></div><span data-i18n="sigma2up"></span></div>
      <div class="legend-item"><div class="legend-line" style="border-top:2px dashed #1D9E75;margin-top:1px;"></div><span data-i18n="sigma1up"></span></div>
      <div class="legend-item"><div class="legend-line" style="background:#185FA5;height:2px;"></div><span data-i18n="expectedMedian"></span></div>
      <div class="legend-item"><div class="legend-line" style="border-top:2px dashed #E24B4A;margin-top:1px;"></div><span data-i18n="sigma1lo"></span></div>
      <div class="legend-item"><div class="legend-line" style="border-top:1px dashed #E24B4A;margin-top:1px;"></div><span data-i18n="sigma2lo"></span></div>
    </div>
    <div class="chart-wrap"><canvas id="eqChart"></canvas></div>
  </div>

  <div id="verdict-box" class="alert-box" style="margin-top:1rem;"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let eqChart = null;
let currentLang = 'ko';

const T = {
  ko: {
    currencySymbol: '₩',
    portfolioLabel: '포트폴리오 규모',
    portfolioError: '유효한 금액을 입력하세요',
    strategyParams: '전략 파라미터',
    winRate: '승률',
    rrRatio: '손익비',
    tradesPerMonth: '월 거래 횟수',
    riskPerTrade: '거래당 최대 손실 (포트폴리오 %)',
    feePerTx: '거래당 수수료',
    feeBreakdown: '비용 상세',
    entryFee: '진입 수수료 (매수)',
    exitFee: '청산 수수료 (매도)',
    totalFeeLabel: '왕복 총 수수료',
    slippageLabel: '슬리피지 (포지션 %)',
    slippageCostLabel: '슬리피지 (손실의 10% 발생 가정)',
    totalCostLabel: '총 비용 (수수료 + 슬리피지)',
    feeAsR: '총 비용 대비 1R (* ATR 미입력 시 최대손실% 사용)',
    evTitle: '거래당 기대값',
    grossEV: '총 기대값 (수수료 전)',
    netEV: '순 기대값 (수수료 후)',
    breakEvenWR: '손익분기 승률',
    edgeLabel: '손익분기 초과 우위',
    monthlyTitle: '월간 예상 수익 (복리)',
    monthlyReturn: '예상 월 수익률',
    feeDrag: '월간 수수료 비용',
    maxLossesLabel: '연속 손실 (발생 확률 1%)',
    chartTitle: '자산 곡선 (로그 스케일)',
    chartWindow: '차트 기간',
    daysUnit: '일',
    sigma2up: '+2σ (상위 95%)',
    sigma1up: '+1σ (상위 68%)',
    expectedMedian: '예상 중앙값',
    sigma1lo: '-1σ (하위 68%)',
    sigma2lo: '-2σ (하위 95%)',
    yAxisLabel: '포트폴리오 가치 (로그 스케일, 시작 = 100)',
    xAxisLabel: '일',
    inARow: '연속',
    drawdown: '손실액',
    ofPortfolio: '포트폴리오 손실',
    tradesShown: '거래 표시',
    tradeEveryPrefix: '평균',
    tradeEverySuffix: '일마다 1거래',
    tradesPerDay: '거래/일',
    zeroTrades: '기간 내 거래 없음',
    positiveAlert: (e) => `전략의 기대값이 양수입니다 — 손익분기 대비 ${e}%p 우위. 주의: 실제 승률은 백테스트보다 5~10%p 낮게 나오는 경향이 있습니다.`,
    marginalAlert: (e) => `기대값이 간신히 양수입니다 — 손익분기 대비 ${e}%p 우위. 실제 승률이 조금만 낮아져도 음수가 될 수 있습니다.`,
    negativeAlert: '현재 설정에서 기대값이 음수입니다. 손익비를 높이거나, 승률을 개선하거나, 수수료를 줄이세요.',
    naRatio: '해당 없음 (0R 목표)',
    naFee: '해당 없음 (리스크 0%)',
    infiniteLosses: '∞ (승률 0%)',
    ppUnit: '%p',
    yours: '현재',
    ofPosition: '포지션의',
    feeStr: (pct) => `포지션의 ${pct}%`,
    presetsLabel: '시장 프리셋 (실시간 데이터)',
    livePriceLabel: '현재 가격',
    stopDollarLabel: '손절 거리 (금액)',
    fetchingLabel: '데이터 로딩 중...',
    fetchErrorLabel: '데이터를 불러오지 못했습니다. 인터넷 연결을 확인하세요.',
    liveDataNote: (sym, price) => `${sym} — 현재가 ${price} (야후파이낸스/바이낸스, 비공식)`,
    atrLabel: '현재 ATR%',
    stopMultLabel: '손절 배수 (ATR 기준)',
    stopDistLabel: '손절 거리',
    posSizeLabel: '권장 포지션 크기',
    noiseRiskLabel: '노이즈 손절 위험',
    leverageWarning: ' ⚠ 레버리지 필요',
    atrDisclaimer: 'ATR은 평균 일일 범위를 나타내며 가격의 분포를 모델링하지 않습니다. 위험 수준은 정확한 확률이 아닌 정성적 지침입니다.',
    noiseRiskFn: (mult) => {
      if (mult < 1.0) return { label: '매우 높음 — 손절이 일반 일일 범위 내에 위치', color: '#E24B4A' };
      if (mult < 1.5) return { label: '높음 — 변동성 큰 날 손절 가능성 있음', color: '#BA7517' };
      if (mult < 2.0) return { label: '보통 — 일반 범위 위에 합리적인 여유', color: '#BA7517' };
      if (mult < 3.0) return { label: '낮음 — 일반 일일 범위를 충분히 벗어남', color: '#1D9E75' };
      return { label: '보수적 — 일반 일일 범위를 크게 벗어남', color: '#1D9E75' };
    },
    langToggleBtn: 'English',
  },
  en: {
    currencySymbol: '$',
    portfolioLabel: 'Portfolio size',
    portfolioError: 'Enter a valid amount',
    strategyParams: 'Strategy parameters',
    winRate: 'Win rate',
    rrRatio: 'Reward:Risk ratio',
    tradesPerMonth: 'Trades per month',
    riskPerTrade: 'Max loss per trade (% of portfolio)',
    feePerTx: 'Fee per transaction',
    feeBreakdown: 'Cost breakdown',
    entryFee: 'Entry fee (buy)',
    exitFee: 'Exit fee (sell)',
    totalFeeLabel: 'Total round-trip fee',
    slippageLabel: 'Slippage (% of position)',
    slippageCostLabel: 'Slippage (assumed 10% of losses)',
    totalCostLabel: 'Total cost (fees + slippage)',
    feeAsR: 'Total cost as % of 1R (* uses max loss % if ATR not set)',
    evTitle: 'Expected value per trade',
    grossEV: 'Gross EV (no fees)',
    netEV: 'Net EV (after fees)',
    breakEvenWR: 'Break-even win rate needed',
    edgeLabel: 'Your edge above break-even',
    monthlyTitle: 'Monthly projection (compounded)',
    monthlyReturn: 'Expected monthly return',
    feeDrag: 'Fee drag per month',
    maxLossesLabel: 'Consecutive losses (1% chance)',
    chartTitle: 'Equity curve (log scale)',
    chartWindow: 'Chart window',
    daysUnit: 'days',
    sigma2up: '+2σ (95th percentile)',
    sigma1up: '+1σ (84th percentile)',
    expectedMedian: 'Expected median',
    sigma1lo: '-1σ (16th percentile)',
    sigma2lo: '-2σ (5th percentile)',
    yAxisLabel: 'Portfolio value (log scale, start = 100)',
    xAxisLabel: 'Days',
    inARow: 'in a row',
    drawdown: 'drawdown',
    ofPortfolio: 'of portfolio lost',
    tradesShown: 'trades shown',
    tradeEveryPrefix: 'avg 1 trade every',
    tradeEverySuffix: 'days',
    tradesPerDay: 'trades/day',
    zeroTrades: '0 trades in window',
    positiveAlert: (e) => `Strategy has positive EV with a ${e}pp edge. Main risk is execution: real win rates often run 5–10pp below backtest estimates.`,
    marginalAlert: (e) => `Marginally positive EV — only ${e}pp above break-even. A small dip in real-world win rate could turn this negative.`,
    negativeAlert: 'Negative expected value with current settings. Either raise your R:R target, improve win rate, or reduce fees.',
    naRatio: 'n/a (0R target)',
    naFee: 'n/a (0% risk)',
    infiniteLosses: '∞ (0% win rate)',
    ppUnit: 'pp',
    yours: 'yours',
    ofPosition: 'of position',
    presetsLabel: 'Market presets (live data)',
    livePriceLabel: 'Current price',
    stopDollarLabel: 'Stop distance ($)',
    fetchingLabel: 'Loading live data...',
    fetchErrorLabel: 'Could not load live data. Check your internet connection.',
    liveDataNote: (sym, price) => `${sym} — price ${price} (Yahoo Finance / Binance, unofficial)`,
    atrLabel: 'Current ATR%',
    stopMultLabel: 'Stop multiple (× ATR)',
    stopDistLabel: 'Stop distance',
    posSizeLabel: 'Suggested position size',
    noiseRiskLabel: 'Noise stop-out risk',
    leverageWarning: ' ⚠ requires leverage',
    atrDisclaimer: 'ATR measures the average daily range but does not model the distribution of price within that range. Risk levels are qualitative guidelines, not precise probabilities.',
    noiseRiskFn: (mult) => {
      if (mult < 1.0) return { label: 'Very high — stop is within the typical daily range', color: '#E24B4A' };
      if (mult < 1.5) return { label: 'High — stop may be hit on volatile days', color: '#BA7517' };
      if (mult < 2.0) return { label: 'Moderate — reasonable buffer above typical range', color: '#BA7517' };
      if (mult < 3.0) return { label: 'Low — stop is well outside the typical daily range', color: '#1D9E75' };
      return { label: 'Conservative — stop is far outside the typical daily range', color: '#1D9E75' };
    },
    feeStr: (pct) => `${pct}% of position`,
    langToggleBtn: '한국어',
  }
};

function t(key) { return T[currentLang][key]; }
function fmt(n) { return t('currencySymbol') + Math.round(Math.abs(n)).toLocaleString(); }
function fmtSigned(n) { return (n >= 0 ? '+' : '-') + fmt(n); }

function applyStaticText() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (T[currentLang][key] !== undefined) el.textContent = T[currentLang][key];
  });
  document.getElementById('currency-prefix').textContent = t('currencySymbol');
  document.getElementById('portfolio-error').textContent = t('portfolioError');
  document.getElementById('lang-btn').textContent = t('langToggleBtn');
}

function toggleLang() {
  currentLang = currentLang === 'ko' ? 'en' : 'ko';
  applyStaticText();
  update();
}

function getPortfolio() {
  const v = parseFloat(document.getElementById('portfolio').value);
  return (isNaN(v) || v < 0) ? null : v;
}

function getVals() {
  return {
    wr:        parseInt(document.getElementById('wr').value) / 100,
    rr:        parseFloat(document.getElementById('rr').value),
    tm:        parseInt(document.getElementById('tm').value),
    rpt:       parseInt(document.getElementById('rpt').value) / 10,
    fee:       parseInt(document.getElementById('fee').value) / 100,
    slip:      parseInt(document.getElementById('slippage').value) / 100,
    chartDays: parseInt(document.getElementById('chartdays').value),
    portfolio: getPortfolio()
  };
}

function calcPTF(wr, netWinFrac, netLossFrac) {
  const safeL = Math.max(1 - netLossFrac, 0.000001);
  if (wr <= 0) return safeL;
  if (wr >= 1) return 1 + netWinFrac;
  return Math.pow(1 + netWinFrac, wr) * Math.pow(safeL, 1 - wr);
}

function update() {
  const { wr, rr, tm, rpt, fee, slip, chartDays, portfolio } = getVals();

  const errEl     = document.getElementById('portfolio-error');
  const portInput = document.getElementById('portfolio');
  if (portfolio === null) {
    portInput.classList.add('input-error');
    errEl.style.display = 'block';
    return;
  }
  portInput.classList.remove('input-error');
  errEl.style.display = 'none';

  // ATR sizing — computed early so cost section can use stopDist
  const atrPct   = parseInt(document.getElementById('atr').value) / 10;
  const stopMult = parseInt(document.getElementById('stopmult').value) / 10;
  const stopDist = atrPct * stopMult;
  const posSizePct = stopDist > 0 ? (rpt * 100) / stopDist : 0;
  const posSizeUsd = portfolio * posSizePct / 100;

  document.getElementById('wr-out').textContent   = (wr * 100).toFixed(0) + '%';
  document.getElementById('rr-out').textContent   = rr.toFixed(2) + 'R';
  document.getElementById('tm-out').textContent   = tm;
  document.getElementById('rpt-out').textContent  = rpt.toFixed(1) + '%';
  document.getElementById('fee-out').textContent  = fee.toFixed(2) + '%';
  document.getElementById('slip-out').textContent = slip.toFixed(2) + '%';
  document.getElementById('days-out').textContent = chartDays;

  // Use stopDist as R denominator when ATR is set; fall back to rpt (assumes 100% position)
  const SLIP_FREQ  = 0.10;
  const totalFee   = fee * 2;
  const rDenom     = stopDist > 0 ? stopDist : rpt;  // = stop_distance × position_size / position_size = stop_distance
  const feeAsR     = rDenom > 0 ? totalFee / rDenom : 0;
  const slipAsR    = rDenom > 0 ? (slip * SLIP_FREQ) / rDenom : 0;
  const totalCostR = feeAsR + slipAsR;
  const R          = rpt;
  const riskPerTrade = portfolio * R / 100;

  const feeStr = (pct) => currentLang === 'ko'
    ? t('ofPosition') + ' ' + pct.toFixed(2) + '%'
    : pct.toFixed(2) + '% ' + t('ofPosition');

  document.getElementById('fee-total').textContent  = feeStr(totalFee);
  document.getElementById('slip-cost').textContent  = feeStr(slip) + '  ×10% = ' + feeStr(slip * SLIP_FREQ);
  document.getElementById('total-cost').textContent = feeStr(totalFee + slip * SLIP_FREQ);
  document.getElementById('fee-r').textContent = rDenom > 0
    ? (totalCostR * 100).toFixed(1) + '% of 1R (' + totalCostR.toFixed(3) + 'R)'
      + (stopDist > 0 ? '' : ' *')
    : t('naFee');

  // netWin: fees reduce wins on both sides; slippage only on losses
  const netWin  = rr - feeAsR;
  const netLoss = 1 + totalCostR;
  const grossEV = wr * rr - (1 - wr);
  const netEV   = wr * netWin - (1 - wr) * netLoss;
  const beWR    = rr > 0 ? (1 + totalCostR) / (rr + 1) : null;

  document.getElementById('ev-gross').textContent = grossEV.toFixed(3) + 'R (' + (grossEV * R).toFixed(2) + '%)  ' + fmt(grossEV * riskPerTrade);
  const evNetEl = document.getElementById('ev-net');
  evNetEl.textContent = netEV.toFixed(3) + 'R (' + (netEV * R).toFixed(2) + '%)  ' + fmt(netEV * riskPerTrade);
  evNetEl.style.color = netEV > 0 ? '#1D9E75' : '#E24B4A';

  document.getElementById('be-wr').textContent = beWR !== null
    ? (beWR * 100).toFixed(1) + '% (' + t('yours') + ': ' + (wr * 100).toFixed(0) + '%)'
    : t('naRatio');

  const edgeEl  = document.getElementById('edge');
  const edgeVal = beWR !== null ? wr - beWR : 0;
  edgeEl.textContent = beWR !== null ? (edgeVal * 100).toFixed(1) + t('ppUnit') : 'n/a';
  edgeEl.style.color = edgeVal > 0.05 ? '#1D9E75' : edgeVal > 0 ? '#BA7517' : '#E24B4A';

  const netWinFrac  = netWin  * R / 100;
  const netLossFrac = netLoss * R / 100;
  const ptf = calcPTF(wr, netWinFrac, netLossFrac);
  const monthlyFactor    = Math.pow(ptf, tm);
  const monthlyReturn    = (monthlyFactor - 1) * 100;
  const monthlyReturnUsd = portfolio * (monthlyFactor - 1);

  // fee drag: compare with-cost vs no-cost
  const ptfNoFee   = calcPTF(wr, rr * R / 100, R / 100);
  const feeDragPct = (Math.pow(ptfNoFee, tm) - monthlyFactor) * 100;
  const feeDragUsd = portfolio * (Math.pow(ptfNoFee, tm) - monthlyFactor);

  const mrEl = document.getElementById('monthly-return');
  mrEl.textContent = (monthlyReturn >= 0 ? '+' : '') + monthlyReturn.toFixed(2) + '%';
  mrEl.className   = 'metric-value ' + (monthlyReturn >= 0 ? 'positive' : 'negative');
  document.getElementById('monthly-return-usd').textContent = fmtSigned(monthlyReturnUsd);
  document.getElementById('monthly-fees').textContent     = '-' + feeDragPct.toFixed(2) + '%';
  document.getElementById('monthly-fees-usd').textContent = '-' + fmt(feeDragUsd);

  const lossRate = 1 - wr;
  let maxLoss;
  if (lossRate <= 0)      maxLoss = 0;
  else if (lossRate >= 1) maxLoss = 99999;
  else                    maxLoss = Math.ceil(Math.log(0.01) / Math.log(lossRate));

  const drawdownFactor = Math.pow(Math.max(1 - netLossFrac, 0.000001), maxLoss);
  const drawdownPct    = (1 - drawdownFactor) * 100;
  const drawdownUsd    = portfolio * (1 - drawdownFactor);

  document.getElementById('max-losses').textContent     = maxLoss < 99999 ? maxLoss + ' ' + t('inARow') : t('infiniteLosses');
  document.getElementById('max-losses-usd').textContent = maxLoss > 0 && maxLoss < 99999 ? fmt(drawdownUsd) + ' ' + t('drawdown') : '';
  document.getElementById('max-losses-pct').textContent = maxLoss > 0 && maxLoss < 99999 && drawdownPct > 0
    ? drawdownPct.toFixed(1) + '% ' + t('ofPortfolio') : '';

  // ATR pre-trade sizing display
  document.getElementById('atr-out').textContent    = atrPct.toFixed(1) + '%';
  document.getElementById('mult-out').textContent   = stopMult.toFixed(1) + '×';
  document.getElementById('stop-dist').textContent  = stopDist.toFixed(2) + '%';
  document.getElementById('pos-size').textContent   = posSizePct.toFixed(1) + '%  (' + fmt(posSizeUsd) + ')' + (posSizePct > 100 ? t('leverageWarning') : '');
  const riskInfo = t('noiseRiskFn')(stopMult);
  const noiseEl  = document.getElementById('noise-risk');
  noiseEl.textContent = riskInfo.label;
  noiseEl.style.color = riskInfo.color;

  buildChart(wr, rr, R, feeAsR, tm, chartDays, ptf, netWinFrac, netLossFrac, portfolio);

  const verdict = document.getElementById('verdict-box');
  const edgeStr = (edgeVal * 100).toFixed(1);
  if (netEV <= 0) {
    verdict.className   = 'alert-box alert-warning';
    verdict.textContent = t('negativeAlert');
  } else if (edgeVal < 0.03) {
    verdict.className   = 'alert-box alert-warning';
    verdict.textContent = t('marginalAlert')(edgeStr);
  } else {
    verdict.className   = 'alert-box alert-good';
    verdict.textContent = t('positiveAlert')(edgeStr);
  }
}

function buildChart(wr, rr, R, feeAsR, tm, chartDays, ptf, netWinFrac, netLossFrac, portfolio) {
  const tradesPerDay = tm / 30;
  const numTrades    = Math.max(1, Math.round(chartDays * tradesPerDay));
  const cappedTrades = Math.min(numTrades, 5000);

  const a    = Math.log(1 + netWinFrac);
  const b    = Math.log(Math.max(1 - netLossFrac, 0.000001));
  const diff = Math.abs(a - b);

  const infoEl = document.getElementById('trades-in-window');
  if (tm === 0) {
    infoEl.textContent = t('zeroTrades');
  } else if (tradesPerDay < 1) {
    infoEl.textContent = t('tradeEveryPrefix') + ' ' + (30 / tm).toFixed(1) + ' ' + t('tradeEverySuffix') + ' — ' + cappedTrades + ' ' + t('tradesShown');
  } else {
    infoEl.textContent = tradesPerDay.toFixed(1) + ' ' + t('tradesPerDay') + ' — ' + cappedTrades + ' ' + t('tradesShown');
  }

  const step = Math.max(1, Math.floor(cappedTrades / 300));
  const medSeries = [100], s1up = [100], s1lo = [100], s2up = [100], s2lo = [100], labels = ['0'];
  let med = 100;

  for (let i = 1; i <= cappedTrades; i++) {
    med *= ptf;
    if (i % step === 0 || i === cappedTrades) {
      const day   = tradesPerDay > 0 ? i / tradesPerDay : 0;
      const sigma = diff * Math.sqrt(i * wr * (1 - wr));
      labels.push(day % 1 === 0 ? day.toFixed(0) : day.toFixed(1));
      medSeries.push(parseFloat(med.toFixed(4)));
      s1up.push(parseFloat((med * Math.exp(sigma)).toFixed(4)));
      s1lo.push(parseFloat(Math.max(med * Math.exp(-sigma), 0.000001).toFixed(6)));
      s2up.push(parseFloat((med * Math.exp(2 * sigma)).toFixed(4)));
      s2lo.push(parseFloat(Math.max(med * Math.exp(-2 * sigma), 0.000001).toFixed(6)));
    }
  }

  const curr = t('currencySymbol');

  if (eqChart) eqChart.destroy();
  eqChart = new Chart(document.getElementById('eqChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: t('sigma2up'),       data: s2up,      borderColor: '#1D9E75', borderWidth: 1,   borderDash: [2,5], pointRadius: 0, fill: false },
        { label: t('sigma1up'),       data: s1up,      borderColor: '#1D9E75', borderWidth: 1.5, borderDash: [4,4], pointRadius: 0, fill: false },
        { label: t('expectedMedian'), data: medSeries, borderColor: '#185FA5', borderWidth: 2,   borderDash: [],    pointRadius: 0, fill: false },
        { label: t('sigma1lo'),       data: s1lo,      borderColor: '#E24B4A', borderWidth: 1.5, borderDash: [4,4], pointRadius: 0, fill: false },
        { label: t('sigma2lo'),       data: s2lo,      borderColor: '#E24B4A', borderWidth: 1,   borderDash: [2,5], pointRadius: 0, fill: false }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 0 },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              const val    = ctx.parsed.y;
              const absVal = portfolio * val / 100;
              const absStr = curr + Math.round(absVal).toLocaleString();
              return ctx.dataset.label + ':  ' + val.toFixed(1) + '  (' + absStr + ')';
            }
          }
        }
      },
      scales: {
        x: {
          title: { display: true, text: t('xAxisLabel'), font: { size: 12 }, color: '#888' },
          ticks: { maxTicksLimit: 10, autoSkip: true }
        },
        y: {
          type: 'logarithmic',
          title: { display: true, text: t('yAxisLabel'), font: { size: 12 }, color: '#888' },
          ticks: {
            callback: function(value) {
              const targets = [0.0001, 0.001, 0.01, 0.1, 1, 5, 10, 25, 50, 100, 200, 500, 1000, 5000, 10000, 100000, 1000000];
              return targets.includes(value) ? value.toLocaleString() : null;
            }
          }
        }
      }
    }
  });
}

applyStaticText();
document.getElementById('portfolio').addEventListener('input', update);
['wr','rr','tm','rpt','fee','slippage','chartdays','atr','stopmult'].forEach(id => {
  document.getElementById(id).addEventListener('input', update);
});
update();

// ── Live data / presets ──────────────────────────────────────────────────────

let livePrice = null;
let activePreset = null;

function parseOHLCV(rows, mapper) {
  const candles = rows.map(mapper).filter(c => c.high != null && c.low != null && c.close != null);
  if (candles.length < 2) throw new Error('Not enough candle data');
  const price = candles[candles.length - 1].close;
  const trs = [];
  for (let i = 1; i < candles.length; i++) {
    const { high, low } = candles[i];
    const prev = candles[i - 1].close;
    trs.push(Math.max(high - low, Math.abs(high - prev), Math.abs(prev - low)));
  }
  const atr14 = trs.slice(-14).reduce((a, b) => a + b, 0) / Math.min(trs.length, 14);
  return { price, atrPct: (atr14 / price) * 100 };
}

async function timedFetch(url, ms = 8000) {
  const res = await fetch(url, { signal: AbortSignal.timeout(ms) });
  if (!res.ok) throw new Error(`HTTP ${res.status} from ${url}`);
  return res.json();
}

// Fetch via allorigins /raw (returns body directly, no wrapper)
async function viaAllorigins(url) {
  const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
  const res   = await fetch(proxy, { signal: AbortSignal.timeout(10000) });
  if (!res.ok) throw new Error(`allorigins HTTP ${res.status}`);
  return res.json();
}

const PRESETS = {
  btc: {
    label: 'BTC Perp',
    feeDefault: 8,
    async fetch() {
      // Kraken public REST — genuinely CORS-friendly, no proxy needed
      // interval 1440 = daily candles
      const data = await timedFetch('https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=1440');
      if (data.error && data.error.length) throw new Error(data.error[0]);
      const rows = data.result['XXBTZUSD'] || data.result[Object.keys(data.result)[0]];
      // Kraken OHLC: [time, open, high, low, close, vwap, volume, count]
      return parseOHLCV(rows, r => ({ high: parseFloat(r[2]), low: parseFloat(r[3]), close: parseFloat(r[4]) }));
    }
  },
  es: {
    label: 'ES (S&P 500 Futures)',
    feeDefault: 2,
    async fetch() { return fetchYahoo('ES=F'); }
  },
  nq: {
    label: 'NQ (Nasdaq Futures)',
    feeDefault: 2,
    async fetch() { return fetchYahoo('NQ=F'); }
  }
};

async function fetchYahoo(ticker) {
  const url  = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=30d`;
  let data;
  try {
    // Try direct first (works in some environments)
    data = await timedFetch(url);
  } catch {
    // Fall back to allorigins proxy
    data = await viaAllorigins(url);
  }
  const q      = data.chart.result[0];
  const highs  = q.indicators.quote[0].high;
  const lows   = q.indicators.quote[0].low;
  const closes = q.indicators.quote[0].close;
  return parseOHLCV(
    highs.map((h, i) => ({ high: h, low: lows[i], close: closes[i] })),
    r => r
  );
}

async function loadPreset(key) {
  const preset = PRESETS[key];
  const btn    = document.getElementById('btn-' + key);
  const badge  = document.getElementById('live-badge');
  const errEl  = document.getElementById('live-error');

  ['btc','es','nq'].forEach(k => {
    document.getElementById('btn-' + k).classList.remove('active');
    document.getElementById('btn-' + k).disabled = false;
  });
  btn.classList.add('active');
  btn.disabled = true;
  badge.innerHTML = T[currentLang].fetchingLabel;
  errEl.style.display = 'none';

  try {
    const { price, atrPct } = await preset.fetch();
    livePrice    = price;
    activePreset = key;

    const atrEl = document.getElementById('atr');
    atrEl.value = Math.min(Math.max(Math.round(atrPct * 10), parseInt(atrEl.min)), parseInt(atrEl.max));
    document.getElementById('fee').value = preset.feeDefault;

    const priceStr = t('currencySymbol') + Math.round(price).toLocaleString();
    badge.innerHTML = T[currentLang].liveDataNote(preset.label, priceStr);
    update();
  } catch(e) {
    console.error('Preset fetch failed:', e);
    livePrice = null;
    badge.innerHTML = '';
    btn.classList.remove('active');
    errEl.textContent   = T[currentLang].fetchErrorLabel + ' (' + e.message + ')';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

// Wrap update to inject dollar rows when live price is known
const _origUpdate = update;
update = function() {
  _origUpdate();
  const atrPct   = parseInt(document.getElementById('atr').value) / 10;
  const stopMult = parseInt(document.getElementById('stopmult').value) / 10;
  const stopDist = atrPct * stopMult;
  if (livePrice && stopDist > 0) {
    const stopDollar = livePrice * stopDist / 100;
    document.getElementById('live-price-display').textContent =
      t('currencySymbol') + Math.round(livePrice).toLocaleString();
    document.getElementById('stop-dollar').textContent =
      t('currencySymbol') + stopDollar.toLocaleString(undefined, { maximumFractionDigits: 2 });
    document.getElementById('row-live-price').style.display  = '';
    document.getElementById('row-stop-dollar').style.display = '';
  } else {
    document.getElementById('row-live-price').style.display  = 'none';
    document.getElementById('row-stop-dollar').style.display = 'none';
  }
};
update();
